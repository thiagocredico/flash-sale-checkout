server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-processor-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

order:
  processor:
    simulate-failure: ${ORDER_PROCESSOR_SIMULATE_FAILURE:false}
  outbox:
    delay-ms: ${OUTBOX_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
